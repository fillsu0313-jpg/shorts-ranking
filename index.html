<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--sub:#646a73;--line:#e3e6ea;--accent:#e5322d;--chip:#eef0f3;--on:#16181d;--onText:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e23;--text:#eceef1;--sub:#9aa1ab;--line:#2c3037;--chip:#252930;--on:#eceef1;--onText:#111316}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 20px 0;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:20px}
.cond{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;color:var(--sub);font-size:12px}
.cond span{background:var(--chip);padding:3px 9px;border-radius:99px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;color:var(--sub);font:inherit;font-size:15px;font-weight:600;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab small{font-weight:400;margin-left:3px}
main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.kw{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;padding:6px 12px;border-radius:99px;cursor:pointer}
.kw.on{background:var(--on);color:var(--onText);border-color:var(--on)}
section{margin-bottom:30px}
h2{font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2 small{color:var(--sub);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}main,header{padding-left:16px;padding-right:16px}.views{font-size:16px}}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;padding:8px 18px;border-radius:99px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;display:block;aspect-ratio:9/16;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px}
.rank.top{font-size:15px;padding:3px 10px}
.dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px}
.body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.title{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:inherit;text-decoration:none}
.title:hover{text-decoration:underline}
.ch{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views{font-size:18px;font-weight:700}
.stats{color:var(--sub);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{background:var(--chip);border-radius:4px;padding:1px 6px;font-size:11px}
details{font-size:12px;color:var(--sub);margin-top:auto}
summary{cursor:pointer;color:var(--text)}
details ul{margin:6px 0 0;padding-left:16px}
.empty{color:var(--sub);padding:40px 0;text-align:center}
footer{color:var(--sub);font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

          <span class="rank ${i<3?'top':''}">${i+1}위</span>
          <span class="dur">${v.duration}초</span>
        </a>
        <div class="body">
          <a class="title" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <div class="ch">${esc(v.channel)} · ${esc(v.published)}</div>
          <div class="views">${kr(v.views)}회</div>
          <div class="stats">좋아요율 ${(v.like_rate*100).toFixed(1)}% · 하루 ${kr(Math.round(v.views_per_day))}회</div>
          <div class="tags">${v.hooks.filter(h => h !== '단순 서술형').slice(0,3).map(h => `<span>${esc(h)}</span>`).join('')}</div>
          <details><summary>왜 인기?</summary><ul>${v.reasons.map(r => `<li>${esc(r)}</li>`).join('')}${
            v.top_comment ? `<li>인기 댓글: "${esc(v.top_comment)}"</li>` : ''}</ul></details>
        </div>
      </div>`).join('');
    return `<section><h2>${esc(k)} <small>${vs.length}개 · 조회수 순위</small></h2>${
      vs.length ? `<div class="grid">${cards}</div>` : '<div class="empty">조건을 만족한 영상이 없습니다</div>'}${
      !full && vs.length > TOP ? `<button class="more" data-m="${esc(age+'|'+k)}">${esc(k)} 전체 ${vs.length}개 보기</button>` : ''}</section>`;
  }).join('');
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tab'), k = e.target.closest('.kw'), m = e.target.closest('.more');
  if (m) { opened.add(m.dataset.m); render(); return; }
  if (t) { age = t.dataset.a; kw = null; render(); window.scrollTo(0,0); }
  if (k) { kw = k.dataset.k || null; render(); }
});
render();
</script>
</body>
</html>
